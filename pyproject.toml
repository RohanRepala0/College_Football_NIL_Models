[project]
name = "nilmodel"
version = "0.1.0"
description = "College Sports Commission compensation data: versioned capture, checks, and an offer benchmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "duckdb>=1.0",
    "typer>=0.12",
    "tabulate>=0.10.0",
    "pytz>=2024.1",            # duckdb needs it to return TIMESTAMPTZ values
]

[project.scripts]
nil = "nilmodel.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nilmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
